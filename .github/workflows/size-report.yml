name: Size report

on:
  push:
    branches:
      - claude/project-thread-f78sjz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size:
    name: Size ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - base
          # Deferred variants, re-enable later:
          # - cert_cmn
          # - log_warn
          # - assert_silent
          # - nano_fmt
          # - combined
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ci-ccache-${{ github.sha }}
          restore-keys: |
            ci-ccache-

      - name: Build and report size
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: bash tools/size_report.sh ${{ matrix.variant }}

      - name: Upload size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: size-${{ matrix.variant }}
          path: size-out/
          if-no-files-found: ignore
          retention-days: 14
