name: Symbolize crash

on:
  push:
    branches:
      - debug/slim-symbolize

permissions:
  contents: read

jobs:
  symbolize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and symbolize
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: bash tools/symbolize_crash.sh
